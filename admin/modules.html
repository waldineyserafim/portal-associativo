<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Módulos — Painel Master · Portal Associativo</title>
  <meta name="robots" content="noindex, nofollow">

  <link rel="icon" type="image/svg+xml" href="../assets/images/icons/favicon.svg">
  <link rel="apple-touch-icon" href="../assets/images/icons/apple-touch-icon.png">
  <meta name="theme-color" content="#A85A34">
  <link href="../css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../css/design-system.css?v=portal-2026-08b">
  <link rel="stylesheet" href="../shared/layouts/admin-shell.css">
  <link rel="stylesheet" href="../shared/components/index.css">
</head>
<body>

<div class="ds-admin-shell">
  <main class="ds-admin-main">
    <div class="mb-4">
      <h1 class="h4 mb-0">Módulos</h1>
      <p class="ds-text-sm ds-text-muted mb-0">
        Visão cross-organização de uso — cada linha é um módulo que existe hoje em pelo menos uma
        organização; habilitar/desabilitar continua na aba "Módulos" de cada organização.
      </p>
    </div>

    <div class="row g-3" id="modulesRow"></div>
    <div class="text-center py-4 ds-text-muted ds-text-sm" id="loading">Carregando…</div>
  </main>
</div>

<script type="module">
  import { requirePlatformAccess, db } from "./assets/admin-auth.js";
  import { renderAdminNav } from "./assets/admin-nav.js";
  import { collection, getDocs } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

  requirePlatformAccess({
    onRole: () => {
      renderAdminNav({ active: "modules" });
      load();
    },
  });

  async function load() {
    try {
      const snap = await getDocs(collection(db, "organizations"));
      const orgs = snap.docs.map((d) => ({ id: d.id, ...d.data() }));

      const byModule = {};
      orgs.forEach((o) => {
        Object.entries(o.modules || {}).forEach(([mod, enabled]) => {
          if (enabled === false) return;
          (byModule[mod] ||= []).push(o);
        });
      });

      const entries = Object.entries(byModule).sort((a, b) => b[1].length - a[1].length);
      const container = document.getElementById("modulesRow");
      container.innerHTML = entries.map(([mod, orgsUsando]) => `
        <div class="col-md-6 col-lg-4">
          <div class="ds-card ds-card-body">
            <div class="d-flex align-items-center justify-content-between mb-2">
              <strong>${mod}</strong>
              <span class="badge bg-primary">${orgsUsando.length} org${orgsUsando.length === 1 ? "" : "s"}</span>
            </div>
            <div class="ds-text-sm ds-text-muted">
              ${orgsUsando.slice(0, 5).map((o) => `<a href="./organization-detail.html?id=${encodeURIComponent(o.id)}#tab-modulos" class="d-block text-truncate">${o.nome || o.id}</a>`).join("")}
              ${orgsUsando.length > 5 ? `<span class="ds-text-xs">+ ${orgsUsando.length - 5} outra(s)</span>` : ""}
            </div>
          </div>
        </div>
      `).join("") || '<div class="col-12"><p class="ds-text-muted text-center py-4">Nenhum módulo habilitado em nenhuma organização ainda.</p></div>';

      document.getElementById("loading").classList.add("d-none");
    } catch (e) {
      document.getElementById("loading").textContent = "Erro ao carregar módulos.";
      console.error(e);
    }
  }
</script>
</body>
</html>
