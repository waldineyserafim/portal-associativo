<?xml version="1.0" encoding="UTF-8"?>
<!--
  Portal Associativo — Favicon vetorial
  Navegadores modernos (Chrome, Firefox, Safari 16+, Edge) aceitam SVG como favicon
  via <link rel="icon" type="image/svg+xml" href="/assets/images/icons/favicon.svg">.
  Para navegadores/contextos sem suporte a SVG favicon, use os PNGs rasterizados
  nesta mesma pasta (favicon-16.png … favicon-128.png) como fallback:

    <link rel="icon" type="image/svg+xml" href="/assets/images/icons/favicon.svg">
    <link rel="alternate icon" href="/assets/images/icons/favicon-32.png">

  Cor fixa em terracota — mesma lógica de destaque em tela lotada usada no ícone de
  app (docs/brand-system/VISUAL_IDENTITY.md §4.7). Fundo transparente: a cor da aba
  do navegador aparece por trás.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="32" height="32"
     role="img" aria-labelledby="portal-associativo-favicon-title">
  <title id="portal-associativo-favicon-title">Portal Associativo</title>
  <path d="M 38.37 85.96 A 34 34 0 1 1 61.63 85.96"
        fill="none" stroke="#A85A34" stroke-width="17" stroke-linecap="round" />
</svg>
