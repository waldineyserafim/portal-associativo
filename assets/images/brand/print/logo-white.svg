<?xml version="1.0" encoding="UTF-8"?>
<!--
  Portal Associativo — Logo para impressão em branco (knockout/reserva)
  Uso: substrato escuro ou colorido — camiseta escura, sacola de tecido, embalagem
  colorida, gravação a laser com preenchimento branco. Sem fundo embutido — a área
  ao redor deve ser o substrato/cor do material, nunca branco sobre branco.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 100" width="500" height="100"
     role="img" aria-labelledby="portal-associativo-logo-white-title">
  <title id="portal-associativo-logo-white-title">Portal Associativo — versão branca (knockout)</title>
  <g id="portal-associativo-logo-white">
    <g id="symbol">
      <path d="M 38.37 85.96 A 34 34 0 1 1 61.63 85.96"
            fill="none" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round" />
    </g>
    <text id="wordmark" x="116" y="66"
          font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
          font-size="36" fill="#FFFFFF">
      <tspan font-weight="500">Portal </tspan><tspan font-weight="700">associativo</tspan>
    </text>
  </g>
</svg>
