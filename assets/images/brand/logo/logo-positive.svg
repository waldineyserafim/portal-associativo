<?xml version="1.0" encoding="UTF-8"?>
<!--
  Portal Associativo — Logo horizontal, versão POSITIVA (cor fixa)
  Uso: fundo claro (off-white #F5F0E6 ou branco). Cor fixa em tinta #211D18.
  Use quando o contexto não suporta currentColor via CSS (PDF estático, PowerPoint,
  Word, e-mail, apps de terceiros).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 100" width="500" height="100"
     role="img" aria-labelledby="portal-associativo-logo-positive-title">
  <title id="portal-associativo-logo-positive-title">Portal Associativo — versão positiva</title>
  <g id="portal-associativo-logo-positive">
    <g id="symbol">
      <path d="M 38.37 85.96 A 34 34 0 1 1 61.63 85.96"
            fill="none" stroke="#211D18" stroke-width="16" stroke-linecap="round" />
    </g>
    <text id="wordmark" x="116" y="66"
          font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
          font-size="36" fill="#211D18">
      <tspan font-weight="500">Portal </tspan><tspan font-weight="700">associativo</tspan>
    </text>
  </g>
</svg>
