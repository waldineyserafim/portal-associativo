<?xml version="1.0" encoding="UTF-8"?>
<!--
  Portal Associativo — Diagrama de construção geométrica
  Referência normativa para redesenho do símbolo em qualquer ferramenta.
  Ver docs/brand-system/VISUAL_IDENTITY.md §4.2–4.3.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 110" width="400" height="440"
     role="img" aria-labelledby="portal-associativo-construction-title">
  <title id="portal-associativo-construction-title">Portal Associativo — grade de construção</title>
  <rect x="0" y="0" width="100" height="110" fill="#F5F0E6" />
  <g font-family="ui-monospace, 'SF Mono', 'Roboto Mono', monospace" font-size="3" fill="#5B5645">
    <!-- guide circle -->
    <circle cx="50" cy="54" r="34" fill="none" stroke="#DDD1B6" stroke-width="0.4" stroke-dasharray="1.5 1.2" />
    <!-- center cross -->
    <line x1="47" y1="54" x2="53" y2="54" stroke="#5B5645" stroke-width="0.3" />
    <line x1="50" y1="51" x2="50" y2="57" stroke="#5B5645" stroke-width="0.3" />
    <!-- radius line -->
    <line x1="50" y1="54" x2="50" y2="20" stroke="#5B5645" stroke-width="0.3" />
    <text x="51.5" y="34">R 34</text>
    <!-- gap angle lines -->
    <line x1="50" y1="54" x2="38.37" y2="85.96" stroke="#5B5645" stroke-width="0.3" />
    <line x1="50" y1="54" x2="61.63" y2="85.96" stroke="#5B5645" stroke-width="0.3" />
    <path d="M 46 62 A 10 10 0 0 1 54 62" fill="none" stroke="#5B5645" stroke-width="0.3" />
    <text x="46" y="70" text-anchor="middle">40°</text>
    <!-- stroke width caliper -->
    <line x1="66" y1="54" x2="82" y2="54" stroke="#5B5645" stroke-width="0.3" />
    <line x1="66" y1="46" x2="66" y2="62" stroke="#5B5645" stroke-width="0.3" />
    <line x1="82" y1="46" x2="82" y2="62" stroke="#5B5645" stroke-width="0.3" />
    <text x="66" y="43" text-anchor="middle">stroke 16</text>
    <!-- center label -->
    <text x="50" y="106" text-anchor="middle">center (50, 54) · viewBox 100×100 · linecap round</text>
  </g>
  <!-- the mark itself -->
  <path d="M 38.37 85.96 A 34 34 0 1 1 61.63 85.96"
        fill="none" stroke="#A85A34" stroke-width="16" stroke-linecap="round" opacity="0.92" />
</svg>
